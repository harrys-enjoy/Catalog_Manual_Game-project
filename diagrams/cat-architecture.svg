<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#172033}.box{fill:#eef4ff;stroke:#3b82f6;stroke-width:2;rx:12}.data{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.sub{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:12}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.title{font-size:28px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px}</style>
