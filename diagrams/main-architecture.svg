  <rect x="40" y="390" width="180" height="80" class="sub"/><text x="130" y="425" text-anchor="middle" class="label">Client / UI</text><text x="130" y="450" text-anchor="middle" class="small">HTTP 요청</text>
  <rect x="280" y="330" width="240" height="200" class="box"/><text x="400" y="370" text-anchor="middle" class="label">Main API Server</text><text x="400" y="400" text-anchor="middle" class="small">src/server.js</text><text x="400" y="430" text-anchor="middle" class="small">/api/ask · /a2a</text><text x="400" y="460" text-anchor="middle" class="small">/message:send</text><text x="400" y="490" text-anchor="middle" class="small">Auth · CORS · Static UI</text>
  <rect x="600" y="330" width="250" height="200" class="box"/><text x="725" y="370" text-anchor="middle" class="label">Orchestrator</text><text x="725" y="405" text-anchor="middle" class="small">request validation</text><text x="725" y="435" text-anchor="middle" class="small">knowledge lookup</text><text x="725" y="465" text-anchor="middle" class="small">agent routing</text><text x="725" y="495" text-anchor="middle" class="small">model invocation</text>
  <rect x="930" y="120" width="220" height="100" class="data"/><text x="1040" y="160" text-anchor="middle" class="label">Knowledge</text><text x="1040" y="188" text-anchor="middle" class="small">data/*.json</text>
  <rect x="930" y="280" width="220" height="100" class="sub"/><text x="1040" y="320" text-anchor="middle" class="label">Agent Registry</text><text x="1040" y="348" text-anchor="middle" class="small">local / remote A2A</text>
  <rect x="930" y="440" width="220" height="100" class="sub"/><text x="1040" y="480" text-anchor="middle" class="label">Model Adapter</text><text x="1040" y="508" text-anchor="middle" class="small">Mock / external model</text>
