<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#172033} .box{fill:#eef4ff;stroke:#3b82f6;stroke-width:2;rx:12} .sub{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:12} .data{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12} .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)} .title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#475569"/></marker></defs>
