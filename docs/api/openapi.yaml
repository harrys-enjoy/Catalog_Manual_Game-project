openapi: 3.0.3
info:
  title: Game Q&A API
  version: 0.1.0
  description: 외부 업무생산성 서비스에서 호출하는 게임 개발 Q&A API
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: 연동 상태 확인
      responses:
        '200':
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/ask:
    post:
      summary: 게임 Q&A 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Q&A 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: 요청 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 지식 자료 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 모델 또는 원격 에이전트 사용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AskRequest:
      type: object
      required: [mode, question]
      properties:
        mode:
          type: string
          enum: [dev-guide, catalog, codex, lore]
        question:
          type: string
          minLength: 1
          maxLength: 2000
        context:
          type: object
          additionalProperties: true
          properties:
            projectId:
              type: string
            userId:
              type: string
            workContext:
              type: string
              enum: [morning-briefing, in-progress]
    AskResponse:
      type: object
      required: [answer, mode, agent, sources, usage, requestId]
      properties:
        answer:
          type: string
        mode:
          type: string
        agent:
          type: string
        sources:
          type: array
          items:
            type: string
        usage:
          nullable: true
          type: object
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
        requestId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, UNSUPPORTED_MODE, KNOWLEDGE_NOT_FOUND, MODEL_UNAVAILABLE, INTERNAL_ERROR]
            message:
              type: string
            requestId:
              type: string
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: game-qna-api
